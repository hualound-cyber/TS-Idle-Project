services:
  postgres:
    image: postgres:16-alpine
    container_name: ts_legends_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: tslegends
      POSTGRES_PASSWORD: tslegends_dev_password
      POSTGRES_DB: tslegends
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tslegends -d tslegends"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ts_legends_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
